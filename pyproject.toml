[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "A small durable workflow execution engine"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
flowforge = "flowforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires FLOWFORGE_TEST_DATABASE_URL and PostgreSQL"]
